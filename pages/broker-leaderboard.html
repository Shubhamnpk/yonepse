<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YONEPSE | Broker Leaderboard</title>
    <meta name="description" content="Broker leaderboard with turnover, ratings and daily stats.">
    <meta name="theme-color" content="#050505">
    <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="../assets/img/favicon.png" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'Inter', 'sans-serif']
                    }
                }
            }
        };
    </script>
</head>

<body class="min-h-screen overflow-x-hidden bg-[#050505] text-white font-display"
    style="background-image: radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%), radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.15) 0%, transparent 40%);">
    <div class="mx-auto max-w-[1200px] p-3 sm:p-5 md:p-8">
        <section aria-label="Live market indices"
            class="mb-3 sm:mb-4 overflow-hidden rounded-full border border-white/10 bg-white/[0.03]">
            <div id="indices-marquee-track"
                class="inline-flex min-w-full items-center gap-6 whitespace-nowrap py-[0.6rem] text-[0.82rem] text-[#a0a0a0] indices-marquee-track">
                <span class="px-4 text-[0.82rem] text-[#a0a0a0]">Loading market indices...</span>
            </div>
        </section>

        <nav aria-label="Primary" class="mb-5 sm:mb-6 flex flex-wrap justify-center gap-2 sm:gap-3">
            <a href="../index.html"
                class="rounded-full border border-white/10 bg-white/[0.03] px-3 sm:px-4 py-1.5 sm:py-2 text-[0.78rem] sm:text-[0.85rem] text-[#a0a0a0] transition hover:border-indigo-500/70 hover:text-white">Market Dashboard</a>
            <a href="data.html"
                class="rounded-full border border-white/10 bg-white/[0.03] px-3 sm:px-4 py-1.5 sm:py-2 text-[0.78rem] sm:text-[0.85rem] text-[#a0a0a0] transition hover:border-indigo-500/70 hover:text-white">Brokers & Datasets</a>
            <a href="broker-leaderboard.html"
                class="rounded-full border border-indigo-500/90 bg-indigo-500/15 px-3 sm:px-4 py-1.5 sm:py-2 text-[0.78rem] sm:text-[0.85rem] text-white">Broker Leaderboard</a>
            <a href="about.html"
                class="rounded-full border border-white/10 bg-white/[0.03] px-3 sm:px-4 py-1.5 sm:py-2 text-[0.78rem] sm:text-[0.85rem] text-[#a0a0a0] transition hover:border-indigo-500/70 hover:text-white">About</a>
        </nav>

        <header class="relative mb-6 sm:mb-8 py-6 sm:py-10 md:py-12 text-center">
            <h1
                class="font-display mb-4 text-2xl sm:text-3xl md:text-4xl lg:text-5xl font-extrabold tracking-[-1px] sm:tracking-[-2px] bg-gradient-to-r from-indigo-500 via-fuchsia-500 to-pink-500 bg-clip-text text-transparent">
                Broker Leaderboard
            </h1>
            <p class="mx-auto max-w-[600px] text-sm sm:text-base md:text-lg text-[#a0a0a0] px-2">Real-time rankings by turnover, ratings, and daily performance.</p>
            <div class="mt-6 flex flex-wrap justify-center gap-3" id="meta-bar">
                <div class="inline-flex items-center gap-2 rounded-full border border-white/10 bg-white/5 px-5 py-2 text-xs text-[#a0a0a0] backdrop-blur">
                    <i class="fa-solid fa-building-columns"></i>
                    <span id="total-brokers">Loading...</span>
                </div>
                <div class="inline-flex items-center gap-2 rounded-full border border-white/10 bg-white/5 px-5 py-2 text-xs text-[#a0a0a0] backdrop-blur">
                    <i class="fa-solid fa-chart-line"></i>
                    <span id="active-today">Loading...</span>
                </div>
                <div class="inline-flex items-center gap-2 rounded-full border border-white/10 bg-white/5 px-5 py-2 text-xs text-[#a0a0a0] backdrop-blur">
                    <i class="fa-solid fa-clock"></i>
                    <span id="scraped-at">Loading...</span>
                </div>

            </div>
        </header>

        <!-- Podium Leaderboard -->
        <section id="podium-section" class="mb-10 hidden">
            <h2 class="text-center text-sm font-semibold uppercase tracking-[3px] text-[#a0a0a0] mb-3 flex items-center justify-center gap-2">
                <i class="fa-solid fa-trophy" style="color:#fbbf24;"></i> Top Brokers <i class="fa-solid fa-trophy" style="color:#fbbf24;"></i>
            </h2>
            <div class="podium-stage">
                <!-- 2nd Place (left, shorter) -->
                <div class="podium-slot podium-slot-2" data-rank="2">
                    <div class="podium-top">
                        <div class="podium-badge silver">
                            <i class="fa-solid fa-medal"></i>
                        </div>
                        <div class="podium-avatar-frame silver-frame">
                            <img id="podium-2-img" class="podium-avatar" src="" alt="">
                            <div class="podium-rank-num silver-num">2</div>
                        </div>
                        <h3 id="podium-2-name" class="podium-name-sm"></h3>
                        <p id="podium-2-code" class="podium-code-sm"></p>
                    </div>
                    <div class="podium-block silver-block">
                        <div class="podium-block-inner">
                            <div id="podium-2-metric" class="podium-block-metric"></div>
                            <div id="podium-2-stars" class="podium-block-stars mb-1"></div>
                            <span id="podium-2-reviews" class="podium-block-reviews"></span>
                        </div>
                    </div>
                </div>

                <!-- 1st Place (center, tallest) -->
                <div class="podium-slot podium-slot-1" data-rank="1">
                    <div class="podium-crown"><i class="fa-solid fa-crown"></i></div>
                    <div class="podium-top golden-top">
                        <div class="podium-badge gold">
                            <i class="fa-solid fa-trophy"></i> #1
                        </div>
                        <div class="podium-avatar-frame gold-frame">
                            <img id="podium-1-img" class="podium-avatar gold-ring" src="" alt="">
                            <div class="podium-rank-num gold-num">1</div>
                        </div>
                        <h3 id="podium-1-name" class="podium-name-xl"></h3>
                        <p id="podium-1-code" class="podium-code-sm"></p>
                    </div>
                    <div class="podium-block gold-block">
                        <div class="podium-block-inner">
                            <div id="podium-1-metric" class="podium-block-metric gold-metric"></div>
                            <div id="podium-1-stars" class="podium-block-stars"></div>
                            <span id="podium-1-reviews" class="podium-block-reviews"></span>
                        </div>
                    </div>
                </div>

                <!-- 3rd Place (right, shortest) -->
                <div class="podium-slot podium-slot-3" data-rank="3">
                    <div class="podium-top">
                        <div class="podium-badge bronze">
                            <i class="fa-solid fa-medal"></i>
                        </div>
                        <div class="podium-avatar-frame bronze-frame">
                            <img id="podium-3-img" class="podium-avatar" src="" alt="">
                            <div class="podium-rank-num bronze-num">3</div>
                        </div>
                        <h3 id="podium-3-name" class="podium-name-sm"></h3>
                        <p id="podium-3-code" class="podium-code-sm"></p>
                    </div>
                    <div class="podium-block bronze-block">
                        <div class="podium-block-inner">
                            <div id="podium-3-metric" class="podium-block-metric"></div>
                            <div id="podium-3-stars" class="podium-block-stars mb-1"></div>
                            <span id="podium-3-reviews" class="podium-block-reviews"></span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <div class="mb-6 flex justify-center">
            <div class="sort-tabs-scroll flex flex-nowrap gap-1.5 sm:gap-2 overflow-x-auto pb-2 -mb-2" id="sort-tabs" role="tablist">
                <button type="button" role="tab" class="sort-tab active-tab" data-sort="todayTurnover">
                    <i class="fa-solid fa-fire"></i> <span class="tab-label">Today's Turnover</span>
                </button>
                <button type="button" role="tab" class="sort-tab" data-sort="thirtyDayTurnover">
                    <i class="fa-solid fa-calendar-week"></i> <span class="tab-label">30-Day Turnover</span>
                </button>
                <button type="button" role="tab" class="sort-tab" data-sort="rating">
                    <i class="fa-solid fa-star"></i> <span class="tab-label">Highest Rated</span>
                </button>
                <button type="button" role="tab" class="sort-tab" data-sort="mostRated">
                    <i class="fa-solid fa-users"></i> <span class="tab-label">Most Reviews</span>
                </button>
                <button type="button" role="tab" class="sort-tab" data-sort="branches">
                    <i class="fa-solid fa-location-dot"></i> <span class="tab-label">Most Branches</span>
                </button>
            </div>
        </div>

        <div class="relative mb-4 min-w-[260px] max-w-md mx-auto">
            <i class="fa-solid fa-magnifying-glass pointer-events-none absolute left-5 top-1/2 -translate-y-1/2 text-[#a0a0a0]"></i>
            <input type="text" id="leaderboard-search"
                class="w-full rounded-xl border border-white/10 bg-white/[0.03] py-3 pl-12 pr-4 text-white placeholder-[#a0a0a0] outline-none transition focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10"
                placeholder="Search by broker name or code..." aria-label="Search brokers">
        </div>

        <main id="leaderboard-grid" class="grid grid-cols-1 gap-4">
            <p class="text-center text-[#a0a0a0] py-12">Loading broker leaderboard...</p>
        </main>

        <footer class="mt-10 text-center text-xs text-[#a0a0a0] opacity-60">
            <span><i class="fa-solid fa-database"></i> Data: ShareHub</span>
        </footer>
    </div>

    <style>
        :root {
            --gold: #fbbf24;
            --gold-dark: #d97706;
            --gold-light: #fde68a;
            --silver: #94a3b8;
            --silver-light: #cbd5e1;
            --bronze: #d97706;
            --bronze-light: #f59e0b;
        }

        /* ===== PODIUM ===== */
        .podium-stage {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 0.75rem;
            padding: 2rem 1rem 0;
            min-height: 360px;
            position: relative;
        }

        .podium-slot {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            transform: translateY(30px);
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .podium-slot.podium-visible {
            transform: translateY(0);
            opacity: 1;
        }
        .podium-slot-2 { transition-delay: 0.1s; }
        .podium-slot-1 { transition-delay: 0.2s; }
        .podium-slot-3 { transition-delay: 0.15s; }

        .podium-slot-1 { z-index: 3; }
        .podium-slot-2 { z-index: 2; }
        .podium-slot-3 { z-index: 1; }
        .podium-slot { cursor: pointer; }
        .podium-slot:hover .podium-avatar { transform: scale(1.08); }
        .podium-slot:hover .podium-block { border-color: rgba(255,255,255,0.2); }
        .podium-slot-1:hover .podium-block { border-color: rgba(251,191,36,0.5); }
        .podium-slot-2:hover .podium-block { border-color: rgba(148,163,184,0.4); }
        .podium-slot-3:hover .podium-block { border-color: rgba(217,119,16,0.5); }

        /* Crown */
        .podium-crown {
            position: absolute;
            top: -28px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            font-size: 2rem;
            color: var(--gold);
            filter: drop-shadow(0 0 12px rgba(251,191,36,0.6));
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s;
            z-index: 5;
            text-shadow: 0 0 20px rgba(251,191,36,0.4);
            animation: crownFloat 3s ease-in-out infinite;
        }
        .podium-slot-1.podium-visible .podium-crown {
            transform: translateX(-50%) scale(1);
        }
        @keyframes crownFloat {
            0%, 100% { transform: translateX(-50%) scale(1) translateY(0); }
            50% { transform: translateX(-50%) scale(1.08) translateY(-4px); }
        }

        /* Badge */
        .podium-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.3rem 0.8rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 0.75rem;
            backdrop-filter: blur(8px);
        }
        .podium-badge.gold {
            background: linear-gradient(135deg, rgba(251,191,36,0.25), rgba(251,191,36,0.1));
            border: 1px solid rgba(251,191,36,0.4);
            color: var(--gold-light);
            font-size: 0.85rem;
            padding: 0.35rem 1rem;
        }
        .podium-badge.silver {
            background: rgba(148,163,184,0.15);
            border: 1px solid rgba(148,163,184,0.3);
            color: var(--silver-light);
        }
        .podium-badge.bronze {
            background: rgba(217,119,16,0.15);
            border: 1px solid rgba(217,119,16,0.3);
            color: var(--bronze-light);
        }

        /* Avatar */
        .podium-avatar-frame {
            position: relative;
            margin-bottom: 0.75rem;
        }
        .podium-avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255,255,255,0.12);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            background: rgba(255,255,255,0.05);
        }
        .podium-slot:hover .podium-avatar { transform: scale(1.08); }
        .gold-frame .podium-avatar {
            width: 90px;
            height: 90px;
            border-width: 3px;
            border-color: var(--gold);
            box-shadow: 0 0 30px rgba(251,191,36,0.25);
        }
        .silver-frame .podium-avatar {
            border-color: var(--silver);
        }
        .bronze-frame .podium-avatar {
            border-color: var(--bronze);
        }
        .gold-ring {
            box-shadow: 0 0 0 4px rgba(251,191,36,0.2), 0 0 30px rgba(251,191,36,0.2);
        }

        .podium-rank-num {
            position: absolute;
            bottom: -4px;
            right: -4px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 800;
            border: 2px solid;
        }
        .gold-num {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #000;
            border-color: #f59e0b;
            width: 32px;
            height: 32px;
            font-size: 0.9rem;
            box-shadow: 0 0 15px rgba(251,191,36,0.4);
        }
        .silver-num {
            background: linear-gradient(135deg, #94a3b8, #64748b);
            color: #fff;
            border-color: #64748b;
        }
        .bronze-num {
            background: linear-gradient(135deg, #d97706, #b45309);
            color: #fff;
            border-color: #b45309;
        }

        /* Name */
        .podium-name-xl {
            font-size: 1.2rem;
            font-weight: 700;
            color: white;
            text-align: center;
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .podium-name-sm {
            font-size: 0.95rem;
            font-weight: 600;
            color: white;
            text-align: center;
            max-width: 160px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .podium-code-sm {
            font-size: 0.75rem;
            color: #a0a0a0;
            text-align: center;
        }

        /* Top section (above block) */
        .podium-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 1rem;
            margin-bottom: 0;
            position: relative;
        }
        .golden-top {
            margin-bottom: -0rem;
        }

        /* Pedestal Block */
        .podium-block {
            width: 100%;
            border-radius: 16px 16px 0 0;
            min-width: 180px;
            position: relative;
            overflow: hidden;
            margin-top: 0.5rem;
        }
        .podium-slot-1 .podium-block {
            min-width: 220px;
            height: 160px;
        }
        .podium-slot-2 .podium-block {
            min-width: 180px;
            height: 100px;
        }
        .podium-slot-3 .podium-block {
            min-width: 160px;
            height: 90px;
            border-radius: 16px 16px 0 0;
            background: linear-gradient(180deg, rgba(217,119,16,0.2) 0%, rgba(180,83,9,0.1) 50%, rgba(120,50,0,0.05) 100%);
            border: 1px solid rgba(217,119,16,0.35);
            border-bottom: none;
            box-shadow: 0 -2px 20px rgba(217,119,16,0.08);
        }

        .podium-block::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 16px 16px 0 0;
            opacity: 0.6;
        }
        .gold-block {
            background: linear-gradient(180deg, rgba(251,191,36,0.2) 0%, rgba(217,119,16,0.08) 100%);
            border: 1px solid rgba(251,191,36,0.3);
            border-bottom: none;
            box-shadow: 0 -4px 30px rgba(251,191,36,0.1);
        }
        .gold-block::before {
            background: linear-gradient(90deg, transparent, rgba(251,191,36,0.08), transparent);
        }
        .silver-block {
            background: linear-gradient(180deg, rgba(148,163,184,0.15) 0%, rgba(100,116,139,0.06) 100%);
            border: 1px solid rgba(148,163,184,0.2);
            border-bottom: none;
        }
        .bronze-block {
            background: linear-gradient(180deg, rgba(217,119,16,0.15) 0%, rgba(180,83,9,0.06) 100%);
            border: 1px solid rgba(217,119,16,0.2);
            border-bottom: none;
        }

        .podium-block-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 0.5rem;
            position: relative;
            z-index: 1;
        }
        .podium-block-metric {
            font-size: 0.9rem;
            font-weight: 700;
        }
        .podium-slot-1 .podium-block-metric {
            font-size: 1.1rem;
            color: var(--gold);
        }
        .podium-slot-2 .podium-block-metric {
            color: var(--silver);
        }
        .podium-slot-3 .podium-block-metric {
            color: var(--bronze);
        }
        .podium-block-metric small {
            display: block;
            font-size: 0.6rem;
            font-weight: 400;
            opacity: 0.6;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .gold-metric small { color: var(--gold-light); }
        .podium-block-stars {
            color: var(--gold);
            font-size: 0.85rem;
        }
        .podium-block-reviews {
            font-size: 0.7rem;
            color: #a0a0a0;
        }

        /* Podium shine sweep */
        .podium-block::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
            transform: skewX(-25deg);
            animation: podiumShine 4s ease-in-out infinite;
        }
        .podium-slot-2 .podium-block::after { animation-delay: 0.5s; }
        .podium-slot-3 .podium-block::after { animation-delay: 1s; }
        @keyframes podiumShine {
            0% { left: -100%; }
            60% { left: 150%; }
            100% { left: 150%; }
        }

        .sort-tabs-scroll {
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .sort-tabs-scroll::-webkit-scrollbar { display: none; }
        @media (max-width: 480px) {
            .sort-tab { padding: 0.45rem 0.75rem; font-size: 0.75rem; gap: 0.3rem; }
            .sort-tab .tab-label { font-size: 0.72rem; }
        }
        @media (max-width: 360px) {
            .sort-tab { padding: 0.4rem 0.6rem; font-size: 0.7rem; }
        }

        .sort-tab {
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.03);
            border-radius: 999px;
            padding: 0.5rem 1rem;
            font-size: 0.82rem;
            color: #a0a0a0;
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            user-select: none;
        }
        .sort-tab:hover {
            border-color: rgba(99,102,241,0.5);
            color: white;
            transform: translateY(-1px);
        }
        .sort-tab:active {
            transform: translateY(0);
        }
        .sort-tab.active-tab,
        .sort-tab[aria-selected="true"] {
            border-color: rgba(99,102,241,0.9);
            background: rgba(99,102,241,0.15);
            color: white;
        }

        .broker-card {
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.03);
            border-radius: 20px;
            padding: 1.25rem;
            backdrop-filter: blur(12px);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 1rem;
            align-items: start;
            opacity: 0;
            transform: translateY(16px) scale(0.97);
        }
        .broker-card.card-visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .broker-card:hover {
            border-color: rgba(99,102,241,0.4);
            background: rgba(255,255,255,0.06);
            transform: translateY(-2px) scale(1.005);
        }
        .broker-card.card-visible:hover {
            transform: translateY(-2px) scale(1.005);
        }

        .broker-card.top-1 {
            background: linear-gradient(135deg, rgba(251,191,36,0.1) 0%, rgba(251,191,36,0.03) 50%, rgba(255,255,255,0.03) 100%);
