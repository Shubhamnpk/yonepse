name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      # Data-bot commits must NOT trigger a deploy
      - 'data/**'
  workflow_dispatch: # Manual deploy anytime (Actions tab → Deploy to GitHub Pages → Run workflow)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage site (skip heavy archives)
        # data/floor_sheet is ~2.5 GB of daily trade archives: Pages caps sites
        # at 1 GB and uploading it added ~10 min to every deploy. It stays in
        # git and is served live from raw.githubusercontent.com instead.
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='data/floor_sheet' ./ _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
