name: Scrape NEPSE Today Price

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'data/company/**'
      - 'data/ipo/**'
      - 'data/proposed_dividend/**'
      - 'data/floor_sheet/**'
  workflow_dispatch: # Triggered by cron-job.org via GitHub API

concurrency:
  group: yonepse-market
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: scripts/nepse-scraper/requirements.txt

    - name: Install dependencies
      run: |
        pip install -r scripts/nepse-scraper/requirements.txt
        pip install PyYAML

    - name: Run Market Scraper
      run: |
        mkdir -p data
        python scripts/nepse-scraper/official_scraper.py --ltp-history live-close

    - name: Run project guardrails
      run: |
        node --check assets/js/script.js
        node --check assets/js/data.js
        node --check assets/js/terminal.js
        node --check assets/js/broker-leaderboard.js
        python -m compileall scripts
        python scripts/validate_project.py
    
    - name: Commit and push changes
      run: |
        git config --global user.name "YONEPSE Data Bot"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data/nepse_data.json data/market data/ltp data/indices data/OMF.json data/notify
        git stash push --include-untracked -m "scraper-autostash" || true
        git pull --rebase --autostash
        git stash pop || true
        git add data/nepse_data.json data/market data/ltp data/indices data/OMF.json data/notify
        git commit -m "Update Official Market Data: $(date)" || echo "No changes to commit"
        git push || (git pull --rebase --autostash && git push)
