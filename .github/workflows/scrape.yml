name: Scrape NEPSE Today Price

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'data/company/**'
      - 'data/ipo/**'
      - 'data/proposed_dividend/**'
      - 'data/floor_sheet/**'
  schedule:
    # Run every 30 minutes from 11:30 AM to 3:00 PM NPT (UTC+5:45).
    # Avoid :00/:30 UTC because GitHub Actions scheduled runs are more likely to be delayed or dropped then.
    # LTP history refreshes intraday while the market is open, then finalizes after close.
    - cron: '45 5-9 * * 1-5'
    - cron: '15 6-9 * * 1-5'
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: yonepse-market
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: scripts/nepse-scraper/requirements.txt

    - name: Install dependencies
      run: |
        pip install -r scripts/nepse-scraper/requirements.txt
        pip install PyYAML

    - name: Run Market Scraper
      run: |
        mkdir -p data
        python scripts/nepse-scraper/official_scraper.py --ltp-history live-close

    - name: Run project guardrails
      run: |
        node --check assets/js/script.js
        node --check assets/js/data.js
        python -m compileall scripts
        python scripts/validate_project.py
    
    - name: Commit and push changes
      run: |
        git config --global user.name "YONEPSE Data Bot"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git pull --rebase --autostash
        git add data/nepse_data.json data/market data/ltp data/OMF.json data/notify data/all_securities.json data/disclosures.json data/exchange_messages.json data/indices.json data/market_status.json data/market_summary.json data/market_summary_history.json data/supply_demand.json data/top_stocks.json
        git commit -m "Update Official Market Data: $(date)" || echo "No changes to commit"
        git push || (git pull --rebase --autostash && git push)
