name: Documentation issue
description: Report unclear, missing, or broken documentation.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: input
    id: page
    attributes:
      label: Document or page
      placeholder: README.md, pages/docs.html, api/openapi.yaml
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What should be fixed?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording or example
